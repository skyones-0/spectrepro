name: macOS CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: macos-15

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Zig
        run: |
          brew install zig
          test "$(zig version)" = "0.16.0"

      - name: Build Zig core
        run: zig build -Demit-macos-app=false

      - name: Test Zig core
        run: zig build test

      - name: Test macOS app
        run: |
          xcodebuild \
            -project macos/SpectrePro.xcodeproj \
            -scheme SpectrePro \
            -configuration Debug \
            -derivedDataPath "$RUNNER_TEMP/SpectreProDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            test \
            -skip-testing SpectreProUITests
