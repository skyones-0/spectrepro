name: Release macOS

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release (format: vX.Y.Z)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: macos-release
  cancel-in-progress: false

jobs:
  release:
    name: Build, sign, notarize, and publish
    runs-on: macos-15
    timeout-minutes: 90
    env:
      MACOS_CERTIFICATE: ${{ secrets.PROD_MACOS_CERTIFICATE }}
      MACOS_CERTIFICATE_NAME: ${{ secrets.PROD_MACOS_CERTIFICATE_NAME }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.PROD_MACOS_CERTIFICATE_PWD }}
      MACOS_KEYCHAIN_PASSWORD: ${{ secrets.PROD_MACOS_CI_KEYCHAIN_PWD }}
      APPLE_NOTARIZATION_ISSUER: ${{ secrets.APPLE_NOTARIZATION_ISSUER }}
      APPLE_NOTARIZATION_KEY_ID: ${{ secrets.APPLE_NOTARIZATION_KEY_ID }}
      APPLE_NOTARIZATION_KEY: ${{ secrets.APPLE_NOTARIZATION_KEY }}
      SPARKLE_PRIVATE_KEY: ${{ secrets.PROD_MACOS_SPARKLE_KEY }}
      SPARKLE_PUBLIC_KEY: ${{ secrets.PROD_MACOS_SPARKLE_KEY_PUB }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Validate release configuration
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            release_tag="${{ inputs.tag }}"
          else
            release_tag="${GITHUB_REF_NAME}"
          fi

          [[ "$release_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git rev-parse --verify "refs/tags/${release_tag}^{commit}" >/dev/null

          for secret_name in \
            MACOS_CERTIFICATE \
            MACOS_CERTIFICATE_NAME \
            MACOS_CERTIFICATE_PASSWORD \
            MACOS_KEYCHAIN_PASSWORD \
            APPLE_NOTARIZATION_ISSUER \
            APPLE_NOTARIZATION_KEY_ID \
            APPLE_NOTARIZATION_KEY \
            SPARKLE_PRIVATE_KEY \
            SPARKLE_PUBLIC_KEY; do
            [[ -n "${!secret_name}" ]] || {
              echo "Missing required repository secret: ${secret_name}" >&2
              exit 1
            }
          done

          echo "RELEASE_TAG=${release_tag}" >> "$GITHUB_ENV"
          echo "SPECTREPRO_VERSION=${release_tag#v}" >> "$GITHUB_ENV"
          echo "SPECTREPRO_BUILD=$(git rev-list --count HEAD)" >> "$GITHUB_ENV"
          echo "SPECTREPRO_COMMIT=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
          echo "SPECTREPRO_COMMIT_LONG=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Install Zig
        run: |
          brew install zig
          test "$(zig version)" = "0.16.0"

      - name: Build SpectreProKit
        run: |
          zig build \
            -Doptimize=ReleaseFast \
            -Demit-macos-app=false \
            -Dversion-string="$SPECTREPRO_VERSION"

      - name: Build Spectre Pro.app
        run: |
          cd macos
          xcodebuild \
            -project SpectrePro.xcodeproj \
            -target SpectrePro \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Set release metadata
        run: |
          app_path="macos/build/Release/SpectrePro.app"
          plist_path="$app_path/Contents/Info.plist"
          test -d "$app_path"

          /usr/libexec/PlistBuddy -c "Set :SpectreProCommit $SPECTREPRO_COMMIT" "$plist_path"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $SPECTREPRO_BUILD" "$plist_path"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $SPECTREPRO_VERSION" "$plist_path"
          /usr/libexec/PlistBuddy -c "Set :SUPublicEDKey $SPARKLE_PUBLIC_KEY" "$plist_path"
          /usr/libexec/PlistBuddy -c "Delete :SUEnableAutomaticChecks" "$plist_path" || true

      - name: Import Developer ID certificate
        run: |
          printf '%s' "$MACOS_CERTIFICATE" | base64 -D > certificate.p12
          security create-keychain -p "$MACOS_KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security unlock-keychain -p "$MACOS_KEYCHAIN_PASSWORD" build.keychain
          security import certificate.p12 \
            -k build.keychain \
            -P "$MACOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign
          security list-keychain -d user -s build.keychain
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$MACOS_KEYCHAIN_PASSWORD" \
            build.keychain

      - name: Sign Spectre Pro.app
        run: |
          app_path="macos/build/Release/SpectrePro.app"
          sign_path() {
            local path="$1"
            if [[ -e "$path" ]]; then
              /usr/bin/codesign --force --options runtime --sign "$MACOS_CERTIFICATE_NAME" "$path"
            fi
          }

          sign_path "$app_path/Contents/Frameworks/Sparkle.framework/Versions/B/XPCServices/Downloader.xpc"
          sign_path "$app_path/Contents/Frameworks/Sparkle.framework/Versions/B/XPCServices/Installer.xpc"
          sign_path "$app_path/Contents/Frameworks/Sparkle.framework/Versions/B/Autoupdate"
          sign_path "$app_path/Contents/Frameworks/Sparkle.framework/Versions/B/Updater.app"
          sign_path "$app_path/Contents/Frameworks/Sparkle.framework"
          sign_path "$app_path/Contents/PlugIns/DockTilePlugin.plugin"
          /usr/bin/codesign \
            --force \
            --options runtime \
            --timestamp \
            --entitlements macos/SpectrePro.entitlements \
            --sign "$MACOS_CERTIFICATE_NAME" \
            "$app_path"
          /usr/bin/codesign --verify --deep --strict --verbose=2 "$app_path"

      - name: Create and notarize DMG
        run: |
          app_path="macos/build/Release/SpectrePro.app"
          dmg_path="$RUNNER_TEMP/SpectrePro.dmg"
          hdiutil create \
            -volname "Spectre Pro" \
            -srcfolder "$app_path" \
            -ov \
            -format UDZO \
            "$dmg_path"

          printf '%s' "$APPLE_NOTARIZATION_KEY" > notarization_key.p8
          xcrun notarytool store-credentials notarytool-profile \
            --key notarization_key.p8 \
            --key-id "$APPLE_NOTARIZATION_KEY_ID" \
            --issuer "$APPLE_NOTARIZATION_ISSUER"
          xcrun notarytool submit "$dmg_path" --keychain-profile notarytool-profile --wait
          xcrun stapler staple "$dmg_path"
          xcrun stapler staple "$app_path"
          mv "$dmg_path" SpectrePro.dmg

      - name: Create ZIP archive
        run: |
          ditto -c -k --keepParent \
            macos/build/Release/SpectrePro.app \
            SpectrePro-macos-universal.zip

      - name: Set up Sparkle tools
        env:
          SPARKLE_VERSION: 2.9.6
        run: |
          mkdir -p "$RUNNER_TEMP/sparkle"
          curl --fail --location --retry 3 \
            "https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_VERSION}/Sparkle-for-Swift-Package-Manager.zip" \
            --output "$RUNNER_TEMP/sparkle/sparkle.zip"
          unzip -q "$RUNNER_TEMP/sparkle/sparkle.zip" -d "$RUNNER_TEMP/sparkle"
          echo "$RUNNER_TEMP/sparkle/bin" >> "$GITHUB_PATH"

      - name: Generate Sparkle appcast
        env:
          SPECTREPRO_DOWNLOAD_URL: https://github.com/skyones-0/spectrepro/releases/download/${{ env.RELEASE_TAG }}/SpectrePro.dmg
        run: |
          printf '%s' "$SPARKLE_PRIVATE_KEY" > sparkle_private_key
          sign_update -f sparkle_private_key SpectrePro.dmg > sign_update.txt
          python3 dist/macos/update_appcast_tag.py
          mv appcast_new.xml appcast.xml

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Spectre Pro ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          files: |-
            SpectrePro.dmg
            SpectrePro-macos-universal.zip
            appcast.xml

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SpectrePro-${{ env.RELEASE_TAG }}
          path: |-
            SpectrePro.dmg
            SpectrePro-macos-universal.zip
            appcast.xml
