name: Personal macOS Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release (format: vX.Y.Z)"
        required: true
        type: string

permissions:
  contents: write
  attestations: write
  id-token: write

concurrency:
  group: personal-macos-release
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish personal release
    runs-on: [self-hosted, macOS, ARM64, spectrepro-release]
    timeout-minutes: 60
    env:
      SPECTREPRO_APP_SIGNING_IDENTITY: "Apple Development: Jose Araujo (26S7BEYLTY)"
      SPARKLE_PRIVATE_KEY: ${{ secrets.SPECTREPRO_SPARKLE_PRIVATE_KEY }}
      SPARKLE_PUBLIC_KEY: ${{ secrets.SPECTREPRO_SPARKLE_PUBLIC_KEY }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Validate release configuration
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            release_tag="${{ inputs.tag }}"
          else
            release_tag="${GITHUB_REF_NAME}"
          fi

          [[ "$release_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git rev-parse --verify "refs/tags/${release_tag}^{commit}" >/dev/null
          [[ -n "$SPARKLE_PRIVATE_KEY" ]]
          [[ -n "$SPARKLE_PUBLIC_KEY" ]]
          [[ -n "$SPECTREPRO_APP_SIGNING_IDENTITY" ]]

          source_version="$(tr -d '[:space:]' < VERSION)"
          [[ "$source_version" == "${release_tag#v}" ]] || {
            echo "VERSION contains $source_version, but the release tag is $release_tag" >&2
            exit 1
          }

          {
            echo "RELEASE_TAG=${release_tag}"
            echo "SPECTREPRO_VERSION=${release_tag#v}"
            echo "SPECTREPRO_BUILD=$(git rev-list --count HEAD)"
            echo "SPECTREPRO_COMMIT=$(git rev-parse --short HEAD)"
            echo "SPECTREPRO_COMMIT_LONG=$(git rev-parse HEAD)"
          } >> "$GITHUB_ENV"

      - name: Install Zig
        run: |
          brew install zig
          test "$(zig version)" = "0.16.0"

      - name: Build SpectreProKit
        run: |
          zig build \
            -Doptimize=ReleaseFast \
            -Demit-macos-app=false \
            -Dversion-string="$SPECTREPRO_VERSION"

      - name: Build Spectre Pro.app
        run: |
          cd macos
          xcodebuild \
            -project SpectrePro.xcodeproj \
            -target SpectrePro \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            MARKETING_VERSION="$SPECTREPRO_VERSION" \
            build

          built_version=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" \
            build/Release/SpectrePro.app/Contents/Info.plist)
          test "$built_version" = "$SPECTREPRO_VERSION"

      - name: Set release metadata
        run: |
          app_path="macos/build/Release/SpectrePro.app"
          plist_path="$app_path/Contents/Info.plist"
          test -d "$app_path"

          /usr/libexec/PlistBuddy -c "Set :SpectreProCommit $SPECTREPRO_COMMIT" "$plist_path"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $SPECTREPRO_BUILD" "$plist_path"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $SPECTREPRO_VERSION" "$plist_path"
          /usr/libexec/PlistBuddy -c "Set :SUPublicEDKey $SPARKLE_PUBLIC_KEY" "$plist_path"
          /usr/libexec/PlistBuddy -c "Delete :SUEnableAutomaticChecks" "$plist_path" || true

      - name: Verify macOS signing identity
        run: |
          security find-identity -v -p codesigning | \
            grep -F "$SPECTREPRO_APP_SIGNING_IDENTITY"

      - name: Sign Spectre Pro.app
        run: |
          app_path="macos/build/Release/SpectrePro.app"
          codesign --force --deep \
            --sign "$SPECTREPRO_APP_SIGNING_IDENTITY" \
            --options runtime \
            "$app_path"
          codesign --verify --deep --strict --verbose=2 "$app_path"
          codesign -d -r- "$app_path" 2>&1 | grep -F 'identifier "co.skyones.spectrepro"'

      - name: Create personal release archives
        run: |
          app_path="macos/build/Release/SpectrePro.app"
          hdiutil create \
            -volname "Spectre Pro" \
            -srcfolder "$app_path" \
            -ov \
            -format UDZO \
            SpectrePro.dmg
          ditto -c -k --keepParent "$app_path" SpectrePro-macos-universal.zip

      - name: Set up Sparkle tools
        env:
          SPARKLE_VERSION: 2.9.6
        run: |
          mkdir -p "$RUNNER_TEMP/sparkle"
          curl --fail --location --retry 3 \
            "https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_VERSION}/Sparkle-for-Swift-Package-Manager.zip" \
            --output "$RUNNER_TEMP/sparkle/sparkle.zip"
          unzip -q "$RUNNER_TEMP/sparkle/sparkle.zip" -d "$RUNNER_TEMP/sparkle"
          echo "$RUNNER_TEMP/sparkle/bin" >> "$GITHUB_PATH"

      - name: Generate Sparkle appcast
        env:
          SPECTREPRO_DOWNLOAD_URL: https://github.com/skyones-0/spectrepro/releases/download/${{ env.RELEASE_TAG }}/SpectrePro.dmg
        run: |
          printf '%s' "$SPARKLE_PRIVATE_KEY" > sparkle_private_key
          sign_update -f sparkle_private_key SpectrePro.dmg > sign_update.txt
          python3 dist/macos/update_appcast_tag.py
          mv appcast_new.xml appcast.xml

      - name: Validate update metadata and checksums
        run: |
          python3 -c 'import xml.etree.ElementTree as element_tree; element_tree.parse("appcast.xml")'
          grep -q 'sparkle:edSignature=' appcast.xml
          shasum -a 256 SpectrePro.dmg SpectrePro-macos-universal.zip > SHA256SUMS.txt

      - name: Generate release SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: macos/build/Release/SpectrePro.app
          format: spdx-json
          output-file: SpectrePro.sbom.spdx.json
          upload-artifact: false

      - name: Attest release archive provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: SpectrePro.dmg

      - name: Attest release SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: SpectrePro.dmg
          sbom-path: SpectrePro.sbom.spdx.json

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Spectre Pro ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          files: |-
            SpectrePro.dmg
            SpectrePro-macos-universal.zip
            appcast.xml
            SHA256SUMS.txt
            SpectrePro.sbom.spdx.json

      - name: Verify published release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p published-release
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir published-release \
            --pattern 'SpectrePro.dmg' \
            --pattern 'SpectrePro-macos-universal.zip' \
            --pattern 'appcast.xml' \
            --pattern 'SHA256SUMS.txt' \
            --pattern 'SpectrePro.sbom.spdx.json'
          (
            cd published-release
            shasum -a 256 -c SHA256SUMS.txt
            python3 -c 'import xml.etree.ElementTree as element_tree; element_tree.parse("appcast.xml")'
            grep -q 'sparkle:edSignature=' appcast.xml
            test -s SpectrePro.sbom.spdx.json
          )

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SpectrePro-${{ env.RELEASE_TAG }}
          path: |-
            SpectrePro.dmg
            SpectrePro-macos-universal.zip
            appcast.xml
            SHA256SUMS.txt
            SpectrePro.sbom.spdx.json
